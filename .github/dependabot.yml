version: 2

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # 工作流按 commit SHA 固定,Dependabot 负责在注释保留版本号并升级。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  # 基础镜像按 digest 固定,此处负责摘要与标签轮换。
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
