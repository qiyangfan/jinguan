name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 门禁 1:后端(Java)── mvn verify 即全量门禁:
  #    spotless check(validate) → test + jacoco → pmd check → spotbugs check
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B verify
      # ── 契约漂移门禁:重新导出根级 openapi.json,与入库版本不一致即红 ──
      - name: openapi contract drift gate
        run: |
          git ls-files --error-unmatch openapi.json
          mvn -B -q -Popenapi verify -DskipTests -Djacoco.skip=true -Dpmd.skip=true -Dspotbugs.skip=true
          git diff --exit-code -- openapi.json

  # ── 门禁 2:前端(TypeScript) ────────────────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        # 版本经 web/package.json 的 packageManager 字段钉死;
        # action 默认只读仓库根 package.json,须显式指向 web/
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm lint:css
        working-directory: web
      - run: pnpm format:check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
