<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>锦官 · 控制面</title>
    <script>
      // 防 FOUC:首帧绘制前按「localStorage 手动值 → 系统偏好」挂 .dark 到 <html>。
      // 契约与 src/lib/theme-store.ts 的 resolveTheme 同源
      // (key jinguan-theme、同优先级),改动必须双侧同步。
      (function () {
        try {
          var t = localStorage.getItem("jinguan-theme");
          var dark =
            t === "dark" ||
            (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
