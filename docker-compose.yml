# 本地启动 PostgreSQL 17 和锦官；删除数据卷需显式使用 `podman compose down -v`。
services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: jinguan
      POSTGRES_USER: jinguan
      POSTGRES_PASSWORD: jinguan
    volumes:
      - jinguan-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jinguan -d jinguan"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    # 与 Makefile 的镜像标签一致。
    image: localhost/jinguan:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      JINGUAN_DB_URL: jdbc:postgresql://db:5432/jinguan
      JINGUAN_DB_USER: jinguan
      JINGUAN_DB_PASSWORD: jinguan
      JINGUAN_INGEST_TOKEN: ${JINGUAN_INGEST_TOKEN:-dev-ingest-token}
      # 生产挂载签名密钥目录(active.pem + retired/*.pem);dev 不设则用进程内临时密钥。
      # JINGUAN_JWT_KEYS_DIR: /run/secrets/jwt-keys
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  jinguan-pgdata: {}
