spring:
  application:
    name: jinguan
  datasource:
    url: ${JINGUAN_DB_URL:jdbc:postgresql://127.0.0.1:5433/jinguan}
    username: ${JINGUAN_DB_USER:jinguan}
    password: ${JINGUAN_DB_PASSWORD:jinguan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema 权威在 Flyway,禁止 hibernate 建表
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${JINGUAN_PORT:8090}

# 仅暴露 health 和 prometheus；配置、环境变量及 Bean 信息端点不对外开放。
# 采集端与下发端点依赖部署网络隔离。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

jinguan:
  security:
    # RS256 issuer 与 audience;RP 按 aud 验签,公钥经 JWKS 发布。
    jwt-issuer: ${JINGUAN_JWT_ISSUER:http://localhost:8090}
    jwt-audience: ${JINGUAN_JWT_AUDIENCE:jinguan}
    # 签名密钥目录:active.pem(PKCS#8 私钥)+ retired/*.pem(退役公钥,保留至旧 token 过期)。
    # 未配置则使用进程内临时密钥,仅供开发,重启即失效。
    jwt-keys-dir: ${JINGUAN_JWT_KEYS_DIR:}
    # 生产必须为 true:缺密钥目录即拒启,禁止静默退化为临时密钥。
    require-persistent-keys: ${JINGUAN_REQUIRE_PERSISTENT_KEYS:false}
    # access 短期有效；refresh 通过 httpOnly cookie 轮换。
    jwt-access-ttl-minutes: ${JINGUAN_JWT_ACCESS_TTL_MINUTES:30}
    jwt-refresh-ttl-days: ${JINGUAN_JWT_REFRESH_TTL_DAYS:7}
    # 并发续期宽限:旧票在窗口内重复提交返回同一后继票,超窗按重放吊销全家族。
    refresh-grace-seconds: ${JINGUAN_REFRESH_GRACE_SECONDS:30}
    # 生产 HTTPS 环境应启用 Secure。
    refresh-cookie-secure: ${JINGUAN_REFRESH_COOKIE_SECURE:false}
    # 过期 refresh 会话行清理间隔;过期票已不可用,默认每小时删一次。
    refresh-cleanup-seconds: ${JINGUAN_REFRESH_CLEANUP_SECONDS:3600}
    # 按 IP 限流；仅 trusted-proxy=true 时采信 X-Forwarded-For。
    rate-limit:
      # OIDC start/callback 与 break-glass 共用的每 IP 每分钟上限。
      login-per-minute: ${JINGUAN_RATE_LIMIT_OIDC:20}
      trusted-proxy: ${JINGUAN_TRUSTED_PROXY:false}
  oidc:
    # Keycloak单一身份；secret 只走 JINGUAN_OIDC_CLIENT_SECRET。
    enabled: ${JINGUAN_OIDC_ENABLED:false}
    issuer: ${JINGUAN_OIDC_ISSUER:}
    client-id: ${JINGUAN_OIDC_CLIENT_ID:}
    client-secret: ${JINGUAN_OIDC_CLIENT_SECRET:}
    redirect-uri: ${JINGUAN_OIDC_REDIRECT_URI:}
    post-logout-redirect-uri: ${JINGUAN_OIDC_POST_LOGOUT_REDIRECT_URI:}
    frontend-success-url: ${JINGUAN_OIDC_FRONTEND_SUCCESS_URL:/}
    scopes: [openid, profile, email]
    # 过期登录 state 清理间隔；state TTL 10 分钟，过期即可删。
    state-cleanup-seconds: ${JINGUAN_OIDC_STATE_CLEANUP_SECONDS:600}
  break-glass:
    # 默认关闭；开启后凭据只从环境变量读取，每次签发写审计。
    enabled: ${JINGUAN_BREAKGLASS_ENABLED:false}
    token: ${JINGUAN_BREAKGLASS_TOKEN:}
    ttl-minutes: ${JINGUAN_BREAKGLASS_TTL_MINUTES:15}
  ingest:
    # muniu IngestSink 使用的 Bearer Token。
    token: ${JINGUAN_INGEST_TOKEN:dev-ingest-token}
  payment:
    order-ttl-minutes: ${JINGUAN_PAYMENT_TTL_MINUTES:60}   # 订单支付有效期。
    expiry-scan-seconds: ${JINGUAN_PAYMENT_SCAN_SECONDS:30} # 过期状态扫描间隔。
  settlement:
    # 单实例周期恢复待结算及欠费用量。
    fixed-delay-ms: ${JINGUAN_SETTLEMENT_DELAY_MS:30000}     # 固定间隔，不重叠执行。
    initial-delay-ms: ${JINGUAN_SETTLEMENT_INITIAL_MS:30000} # 启动后首次扫描延迟。
    max-users: ${JINGUAN_SETTLEMENT_MAX_USERS:100}           # 每轮最大用户数。
    max-rows-per-user: ${JINGUAN_SETTLEMENT_MAX_ROWS:100}    # 每用户每轮最大行数。
