spring:
  application:
    name: jinguan
  datasource:
    url: ${JINGUAN_DB_URL:jdbc:postgresql://127.0.0.1:5433/jinguan}
    username: ${JINGUAN_DB_USER:jinguan}
    password: ${JINGUAN_DB_PASSWORD:jinguan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema 权威在 Flyway,禁止 hibernate 建表
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${JINGUAN_PORT:8090}

# 仅暴露 health 和 prometheus；配置、环境变量及 Bean 信息端点不对外开放。
# 采集端与下发端点依赖部署网络隔离。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

jinguan:
  security:
    # 生产环境需注入至少 32 字节的 JWT 密钥。
    jwt-secret: ${JINGUAN_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    # access 短期有效；refresh 通过 httpOnly cookie 轮换。
    jwt-access-ttl-minutes: ${JINGUAN_JWT_ACCESS_TTL_MINUTES:30}
    jwt-refresh-ttl-days: ${JINGUAN_JWT_REFRESH_TTL_DAYS:7}
    # 生产 HTTPS 环境应启用 Secure。
    refresh-cookie-secure: ${JINGUAN_REFRESH_COOKIE_SECURE:false}
    # 按 IP 限流；仅 trusted-proxy=true 时采信 X-Forwarded-For。
    rate-limit:
      login-per-minute: ${JINGUAN_RATE_LIMIT_LOGIN:10}
      register-per-minute: ${JINGUAN_RATE_LIMIT_REGISTER:3}
      trusted-proxy: ${JINGUAN_TRUSTED_PROXY:false}
  ingest:
    # muniu IngestSink 使用的 Bearer Token。
    token: ${JINGUAN_INGEST_TOKEN:dev-ingest-token}
  payment:
    order-ttl-minutes: ${JINGUAN_PAYMENT_TTL_MINUTES:60}   # 订单支付有效期。
    expiry-scan-seconds: ${JINGUAN_PAYMENT_SCAN_SECONDS:30} # 过期状态扫描间隔。
  settlement:
    # 单实例周期恢复待结算及欠费用量。
    fixed-delay-ms: ${JINGUAN_SETTLEMENT_DELAY_MS:30000}     # 固定间隔，不重叠执行。
    initial-delay-ms: ${JINGUAN_SETTLEMENT_INITIAL_MS:30000} # 启动后首次扫描延迟。
    max-users: ${JINGUAN_SETTLEMENT_MAX_USERS:100}           # 每轮最大用户数。
    max-rows-per-user: ${JINGUAN_SETTLEMENT_MAX_ROWS:100}    # 每用户每轮最大行数。
