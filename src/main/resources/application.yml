spring:
  application:
    name: jinguan
  datasource:
    url: ${JINGUAN_DB_URL:jdbc:postgresql://127.0.0.1:5433/jinguan}
    username: ${JINGUAN_DB_USER:jinguan}
    password: ${JINGUAN_DB_PASSWORD:jinguan}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema 权威在 Flyway,禁止 hibernate 建表
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${JINGUAN_PORT:8090}

# 指标暴露面白名单:只放 health(镜像 HEALTHCHECK 依赖,语义不得变)与 prometheus。
# env/configprops/beans/mappings/heapdump 能读出配置项与环境变量引用名,一律不暴露;
# 采集端与 /control/v1/* 同信任前提(部署网络隔离,见 README 演进登记与 SecurityConfig 注记)。
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

jinguan:
  security:
    # JWT 签名密钥(生产经环境注入,≥32 字节);本地 dev 默认值仅限本机
    jwt-secret: ${JINGUAN_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    # 双 token:access 短 TTL(API 认证,前端内存态);refresh 长 TTL(httpOnly cookie,仅 /auth/refresh 轮换)
    jwt-access-ttl-minutes: ${JINGUAN_JWT_ACCESS_TTL_MINUTES:30}
    jwt-refresh-ttl-days: ${JINGUAN_JWT_REFRESH_TTL_DAYS:7}
    # refresh cookie Secure 标志(生产 HTTPS 环境注入 true;本地 dev http 为 false)
    refresh-cookie-secure: ${JINGUAN_REFRESH_COOKIE_SECURE:false}
    # 登录/注册防爆破:per-IP 固定窗口;trusted-proxy=true 才采信 X-Forwarded-For
    rate-limit:
      login-per-minute: ${JINGUAN_RATE_LIMIT_LOGIN:10}
      register-per-minute: ${JINGUAN_RATE_LIMIT_REGISTER:3}
      trusted-proxy: ${JINGUAN_TRUSTED_PROXY:false}
  ingest:
    # muniu IngestSink 投递的 Bearer Token(与 muniu .env 的 ingest token 同值)
    token: ${JINGUAN_INGEST_TOKEN:dev-ingest-token}
  payment:
    order-ttl-minutes: ${JINGUAN_PAYMENT_TTL_MINUTES:60}   # 订单支付有效期(渠道语义)
    expiry-scan-seconds: ${JINGUAN_PAYMENT_SCAN_SECONDS:30} # 过期收敛扫描间隔(仅状态及时性,资金正确性由回调守门保证)
